# .streamlit/secrets.toml template
# INSTRUCTIONS:
# 1. Create a folder named `.streamlit` in your project root.
# 2. Copy this file into that folder, rename it to `secrets.toml`, and replace the placeholder values.
# 3. Add `.streamlit/secrets.toml` to your `.gitignore` file to ensure credentials are never committed.
# 4. Share your Google Sheet with the `client_email` address as an Editor.

[connections.gsheets]
# The public link or private link of your Google Sheet.
# E.g., "https://docs.google.com/spreadsheets/d/1A2B3C.../edit"
spreadsheet = "https://docs.google.com/spreadsheets/d/your-spreadsheet-id-here/edit"

# The connection type (must be "service_account" for private sheets / CRUD operations)
type = "service_account"

# Copy these fields directly from your downloaded Google Service Account JSON key file:
project_id = "your-gcp-project-id"
private_key_id = "your-service-account-private-key-id"

# Note: The private_key must include exact newlines as \n in a single line, 
# or formatted as a multi-line TOML string with triple quotes.
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY_CONTENT_WITH_NEWLINES\n-----END PRIVATE KEY-----\n"

client_email = "your-service-account-email@your-gcp-project-id.iam.gserviceaccount.com"
client_id = "your-service-account-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account-email%40your-gcp-project-id.iam.gserviceaccount.com"
